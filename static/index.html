<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BabySteps — Your AI companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Visual language from the team designer's prototype: lavender ambient gradient,
     frosted "glass" cards, Fraunces headings, Figtree text, large rounded shapes. */
  :root {
    --background: oklch(0.975 0.008 300);
    --foreground: oklch(0.22 0.03 290);
    --primary: oklch(0.42 0.11 292);
    --primary-fg: oklch(0.99 0.004 300);
    --secondary: oklch(0.93 0.025 300);
    --muted-fg: oklch(0.46 0.03 290);
    --accent: oklch(0.88 0.06 300);
    --accent-fg: oklch(0.28 0.07 292);
    --border: oklch(0.9 0.015 300);
    --destructive: oklch(0.6 0.2 25);
    --live: oklch(0.7 0.16 150);
    --glass: oklch(1 0 0 / 55%);
    --glass-strong: oklch(1 0 0 / 78%);
    --shadow-soft: 0 20px 50px -20px oklch(0.35 0.08 292 / 30%);
    --shadow-float: 0 10px 30px -8px oklch(0.2 0.05 290 / 35%);
    --ambient:
      radial-gradient(60% 50% at 15% 10%, oklch(0.9 0.06 300 / 90%), transparent 70%),
      radial-gradient(50% 45% at 90% 20%, oklch(0.93 0.05 60 / 80%), transparent 70%),
      radial-gradient(60% 60% at 60% 100%, oklch(0.9 0.05 320 / 70%), transparent 70%),
      oklch(0.975 0.008 300);
  }
  * { box-sizing: border-box; }
  html { font-size: 18px; }
  body { margin:0; height:100dvh; display:flex; flex-direction:column; background: var(--ambient); background-attachment: fixed;
         color: var(--foreground); font-family: "Figtree", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .glass { background: var(--glass); backdrop-filter: blur(24px) saturate(160%); border: 1px solid oklch(1 0 0 / 60%); }
  .glass-strong { background: var(--glass-strong); backdrop-filter: blur(28px) saturate(160%); border: 1px solid oklch(1 0 0 / 70%); }
  .display { font-family: "Fraunces", Georgia, serif; letter-spacing: -0.02em; }

  header { display:flex; align-items:center; gap:14px; padding: 12px 20px; border-left:0; border-right:0; border-top:0; }
  header img { width:52px; height:52px; border-radius:50%; object-fit:cover; box-shadow: var(--shadow-float); }
  header .who { flex:1; min-width:0; }
  header .who b { display:block; font-size:1.15rem; }
  header .who span { color: var(--muted-fg); font-size: .85rem; white-space:nowrap; display:flex; align-items:center; gap:6px; }
  header .who span::before { content:""; width:8px; height:8px; border-radius:50%; background: var(--live); }
  .pill { display:inline-flex; align-items:center; gap:8px; height:44px; padding: 0 18px; border-radius:999px; font: 600 .85rem "Figtree", sans-serif;
          color: var(--primary); text-decoration:none; border: 2px solid oklch(0.42 0.11 292 / 25%); background: transparent; cursor:pointer; }
  .pill:hover { background: oklch(0.42 0.11 292 / 6%); }

  #log { flex:1; overflow-y:auto; padding: 28px 20px 12px; }
  #inner { max-width: 760px; margin: 0 auto; display:flex; flex-direction:column; gap:16px; }
  #inner h1 { font-size: 2.3rem; line-height:1.1; margin: 8px 0 4px; font-weight:400; }
  .row { display:flex; align-items:flex-end; gap:10px; max-width: 90%; animation: rise .5s cubic-bezier(.2,.8,.2,1) both; }
  .row img { width:36px; height:36px; border-radius:50%; object-fit:cover; flex-shrink:0; }
  .msg { padding: 14px 20px; font-size: 1.05rem; line-height: 1.55; white-space: pre-wrap; }
  .assistant { border-radius: 1.6rem 1.6rem 1.6rem .4rem; }
  .user { align-self:flex-end; max-width:85%; background: var(--primary); color: var(--primary-fg);
          border-radius: 1.6rem 1.6rem .4rem 1.6rem; box-shadow: var(--shadow-float); animation: rise .5s cubic-bezier(.2,.8,.2,1) both; }
  .action { align-self:flex-start; margin-left: 46px; display:inline-flex; align-items:center; gap:8px; font-size:.8rem;
            color: var(--muted-fg); padding: 5px 12px; border-radius: 999px; }
  .action::before { content:""; width:7px; height:7px; border-radius:50%; background: var(--primary); opacity:.6; }
  .error { align-self:stretch; border-radius: 1rem; padding: 12px 18px; background: oklch(0.95 0.04 25); color: oklch(0.45 0.17 25); font-size:.9rem; }
  .letter { align-self:flex-end; max-width:85%; background:#fffef9; border-radius: 1rem; box-shadow: var(--shadow-soft);
            font-family: "Courier New", monospace; font-size:.75rem; line-height:1.45; padding:18px 22px; white-space:pre-wrap;
            animation: rise .5s cubic-bezier(.2,.8,.2,1) both; }
  .letter b { font-family: "Figtree", sans-serif; display:flex; align-items:center; gap:8px; margin-bottom:10px; font-size:.95rem; color: var(--primary); }
  #typing { display:none; }
  #typing.on { display:flex; }
  #typing .dots { display:flex; gap:6px; padding: 18px 22px; border-radius: 1.6rem 1.6rem 1.6rem .4rem; }
  #typing .dots span { width:10px; height:10px; border-radius:50%; background: var(--muted-fg); animation: bounce 1s infinite; }
  #typing .dots span:nth-child(2) { animation-delay: .15s; } #typing .dots span:nth-child(3) { animation-delay: .3s; }

  #bottom { padding: 6px 20px 18px; }
  #bottom > div { max-width: 760px; margin: 0 auto; }
  #docs { display:flex; flex-wrap:wrap; gap:10px; margin-bottom: 12px; }
  #docs button { display:flex; align-items:center; gap:12px; padding: 10px 18px 10px 10px; border-radius: 1.2rem; cursor:pointer;
                 font: 600 .9rem "Figtree", sans-serif; color: var(--foreground); box-shadow: var(--shadow-soft); transition: transform .2s; }
  #docs button:hover { transform: translateY(-2px); }
  #docs button .ico { display:grid; place-items:center; width:38px; height:38px; border-radius: .8rem; background: var(--accent); color: var(--accent-fg); font-size:1.1rem; }
  #docs button:disabled { opacity:.45; cursor:wait; transform:none; }
  form { display:flex; align-items:flex-end; gap:8px; padding: 8px; border-radius: 2rem; box-shadow: var(--shadow-soft); }
  #text { flex:1; min-width:0; min-height: 56px; max-height: 160px; resize:none; border:0; outline:none; background:transparent;
          padding: 16px 14px; font: 1.05rem "Figtree", sans-serif; color: var(--foreground); }
  #text::placeholder { color: var(--muted-fg); }
  #send { width:52px; height:52px; border-radius:50%; border:0; background: var(--primary); color: var(--primary-fg);
          font-size: 1.5rem; cursor:pointer; box-shadow: var(--shadow-float); flex-shrink:0; }
  #send:disabled { opacity:.4; cursor:wait; }

  @keyframes rise { from { opacity:0; transform: translateY(12px); } to { opacity:1; transform:none; } }
  @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
</style>
</head>
<body>
<header class="glass">
  <img src="/static/img/alex.png" alt="Alex">
  <div class="who"><b>Alex</b><span>Your BabySteps companion</span></div>
  <a class="pill" href="/passwords" target="_blank">🔑 Password book</a>
  <a class="pill" href="/memory" target="_blank">What I remember</a>
  <button class="pill" id="reset" type="button">Start over</button>
</header>
<div id="log"><div id="inner">
  <h1 class="display">Hi! What can I help you with today?</h1>
  <div class="row"><img src="/static/img/alex.png" alt=""><div class="msg assistant glass-strong">Just tell me what you want to do, or show me a letter. I'll do it in the window next to this one, one step at a time.</div></div>
  <div class="row" id="typing"><img src="/static/img/alex.png" alt=""><div class="dots glass-strong"><span></span><span></span><span></span></div></div>
</div></div>
<div id="bottom"><div>
  <div id="docs"></div>
  <form id="form" class="glass-strong">
    <textarea id="text" rows="1" autocomplete="off" placeholder="Message Alex…" aria-label="Message"></textarea>
    <button id="send" type="submit" aria-label="Send">↑</button>
  </form>
</div></div>
<script>
const log = document.getElementById('log');
const inner = document.getElementById('inner');
const typing = document.getElementById('typing');
const text = document.getElementById('text');
const send = document.getElementById('send');
let busy = false;

function place(el) { inner.insertBefore(el, typing); log.scrollTop = log.scrollHeight; }
function add(cls, content) {
  let el;
  if (cls === 'assistant') {
    el = document.createElement('div'); el.className = 'row';
    const img = document.createElement('img'); img.src = '/static/img/alex.png'; img.alt = '';
    const b = document.createElement('div'); b.className = 'msg assistant glass-strong'; b.textContent = content;
    el.append(img, b);
  } else {
    el = document.createElement('div');
    el.className = cls === 'action' ? 'action glass' : 'msg ' + cls;
    el.textContent = content;
  }
  el.dataset.chat = '1';
  place(el);
}
function setBusy(b) {
  busy = b; send.disabled = b; document.querySelectorAll('#docs button').forEach(x => x.disabled = b);
  typing.classList.toggle('on', b);
  if (b) log.scrollTop = log.scrollHeight; else text.focus();
}

const ws = new WebSocket(`ws://${location.host}/ws`);
ws.onmessage = (ev) => {
  const m = JSON.parse(ev.data);
  if (m.type === 'assistant') add('assistant', m.text);
  else if (m.type === 'action') add('action', m.text);
  else if (m.type === 'error') add('error', 'Something went wrong: ' + m.text);
  else if (m.type === 'busy') setBusy(true);
  else if (m.type === 'done') setBusy(false);
  else if (m.type === 'reset') inner.querySelectorAll('[data-chat]').forEach(e => e.remove());
};
ws.onclose = () => add('error', 'Lost the connection. Please reload the page.');

function submit() {
  // Double-click safe: ignore sends while a reply is running or when empty.
  const t = text.value.trim();
  if (busy || !t) return;
  add('user', t);
  text.value = '';
  setBusy(true);
  ws.send(JSON.stringify({type: 'user', text: t}));
}
document.getElementById('form').addEventListener('submit', (e) => { e.preventDefault(); submit(); });
text.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(); } });
document.getElementById('reset').addEventListener('click', () => { if (!busy) ws.send(JSON.stringify({type: 'reset'})); });

const icons = { tv_fee: '📺', fake_fine: '⚠️', tax: '🧾' };
fetch('/api/documents').then(r => r.json()).then(docs => {
  for (const [id, d] of Object.entries(docs)) {
    const btn = document.createElement('button');
    btn.type = 'button'; btn.className = 'glass-strong';
    const ico = document.createElement('span'); ico.className = 'ico'; ico.textContent = icons[id] || '📄';
    btn.append(ico, document.createTextNode(d.button));
    btn.addEventListener('click', () => {
      if (busy) return;
      const q = text.value.trim();
      if (q) add('user', q);
      const card = document.createElement('div');
      card.className = 'letter'; card.dataset.chat = '1';
      const t = document.createElement('b'); t.textContent = '📄 ' + d.title;
      card.append(t, document.createTextNode(d.text));
      place(card);
      text.value = ''; setBusy(true);
      ws.send(JSON.stringify({type: 'document', id, text: q}));
    });
    document.getElementById('docs').appendChild(btn);
  }
});
text.focus();
</script>
</body>
</html>
