<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BabySteps</title>
<style>
  :root { --bg:#fdf8f0; --ink:#1f1f1f; --me:#dbeafe; --bot:#ffffff; --act:#6b7280; --accent:#c2410c; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family: Helvetica, Arial, sans-serif;
         font-size: 22px; height: 100vh; display:flex; flex-direction:column; }
  header { padding: 14px 20px; display:flex; align-items:center; justify-content:space-between;
           border-bottom: 2px solid #eadfcf; }
  header h1 { margin:0; font-size: 28px; }
  header h1 span { color: var(--accent); }
  #reset { font-size: 16px; padding: 8px 14px; border-radius: 8px; border: 1px solid #bbb; background:#fff; cursor:pointer; }
  #log { flex:1; overflow-y:auto; padding: 20px; display:flex; flex-direction:column; gap: 12px; }
  .msg { max-width: 85%; padding: 14px 18px; border-radius: 16px; line-height: 1.4; white-space: pre-wrap; }
  .user { align-self:flex-end; background: var(--me); }
  .assistant { align-self:flex-start; background: var(--bot); box-shadow: 0 1px 4px #0001; }
  .action { align-self:flex-start; color: var(--act); font-size: 17px; padding: 0 6px; }
  .action::before { content: "👉 "; }
  .error { align-self:stretch; background:#fee2e2; color:#991b1b; font-size:17px; }
  form { display:flex; gap: 12px; padding: 16px 20px; border-top: 2px solid #eadfcf; }
  #text { flex:1; font-size: 22px; padding: 14px; border-radius: 12px; border: 2px solid #bbb; }
  #send { font-size: 22px; padding: 0 28px; border-radius: 12px; border: 0; background: var(--accent);
          color:#fff; cursor:pointer; }
  #send:disabled { background:#d6c4b5; cursor: wait; }
  #docs { display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding: 10px 20px 0; font-size:17px; color:#555; }
  #docs button { font-size:17px; padding:8px 14px; border-radius:10px; border:2px solid #c2410c; background:#fff; color:#c2410c; cursor:pointer; }
  #docs button:disabled { opacity:.5; cursor:wait; }
  .letter { align-self:flex-end; max-width:85%; background:#fffef7; border:1px solid #d6cfa8; box-shadow: 2px 3px 8px #0002;
            font-family: "Courier New", monospace; font-size:15px; padding:16px 20px; white-space:pre-wrap; border-radius:4px; }
  .letter b { font-family: Helvetica, Arial, sans-serif; display:block; margin-bottom:8px; font-size:17px; }
  #thinking { display:none; align-self:flex-start; color:var(--act); font-size:17px; }
  #thinking.on { display:block; }
</style>
</head>
<body>
<header>
  <h1>Baby<span>Steps</span></h1>
  <span><a href="/passwords" target="_blank" style="font-size:16px;margin-right:14px">🔑 Password book</a><a href="/memory" target="_blank" style="font-size:16px;margin-right:14px">What I remember</a><button id="reset" type="button">Start over</button></span>
</header>
<div id="log">
  <div class="msg assistant">Hello! I can help you with things on the computer. Just tell me what you want to do — for example "I want to read my emails". I will do it in the window next to this one.</div>
  <div id="thinking">One moment…</div>
</div>
<div id="docs">📄 Show the helper a letter:</div>
<form id="form">
  <input id="text" autocomplete="off" placeholder="Type your question here…">
  <button id="send" type="submit">Send</button>
</form>
<script>
const log = document.getElementById('log');
const thinking = document.getElementById('thinking');
const text = document.getElementById('text');
const send = document.getElementById('send');
let busy = false;

function add(cls, content) {
  const d = document.createElement('div');
  d.className = cls === 'action' ? 'action' : 'msg ' + cls;
  d.textContent = content;
  log.insertBefore(d, thinking);
  log.scrollTop = log.scrollHeight;
}
function setBusy(b) {
  busy = b; send.disabled = b; document.querySelectorAll('#docs button').forEach(x => x.disabled = b); thinking.classList.toggle('on', b);
  if (!b) text.focus();
}

const ws = new WebSocket(`ws://${location.host}/ws`);
ws.onmessage = (ev) => {
  const m = JSON.parse(ev.data);
  if (m.type === 'assistant') add('assistant', m.text);
  else if (m.type === 'action') add('action', m.text);
  else if (m.type === 'error') add('error', 'Something went wrong: ' + m.text);
  else if (m.type === 'busy') setBusy(true);
  else if (m.type === 'done') setBusy(false);
  else if (m.type === 'reset') { log.querySelectorAll('.msg,.action,.letter').forEach((e, i) => i && e.remove()); }
};
ws.onclose = () => add('error', 'Lost the connection. Please reload the page.');

document.getElementById('form').addEventListener('submit', (e) => {
  e.preventDefault();
  // Double-click safe: ignore sends while a reply is running or when empty.
  const t = text.value.trim();
  if (busy || !t) return;
  add('user', t);
  text.value = '';
  setBusy(true);
  ws.send(JSON.stringify({type: 'user', text: t}));
});
document.getElementById('reset').addEventListener('click', () => {
  if (!busy) ws.send(JSON.stringify({type: 'reset'}));
});
fetch('/api/documents').then(r => r.json()).then(docs => {
  for (const [id, d] of Object.entries(docs)) {
    const btn = document.createElement('button');
    btn.type = 'button'; btn.textContent = d.button;
    btn.addEventListener('click', () => {
      if (busy) return;
      const q = text.value.trim();
      if (q) add('user', q);
      const card = document.createElement('div');
      card.className = 'letter';
      const t = document.createElement('b'); t.textContent = d.title;
      card.appendChild(t); card.appendChild(document.createTextNode(d.text));
      log.insertBefore(card, thinking); log.scrollTop = log.scrollHeight;
      text.value = ''; setBusy(true);
      ws.send(JSON.stringify({type: 'document', id, text: q}));
    });
    document.getElementById('docs').appendChild(btn);
  }
});
text.focus();
</script>
</body>
</html>
